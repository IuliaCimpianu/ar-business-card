<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print AR marker</title><style>body{font:16px system-ui;text-align:center}#qr{width:60mm;height:60mm;margin:25mm auto 8mm}#qr svg{width:100%;height:100%}@media print{button{display:none}body{margin:0}}</style></head><body><h2>WebSpark AR test marker</h2><div id="qr"></div><p>Print at 100% scale. QR outer square: 60 × 60 mm.</p><button onclick="print()">Print</button><script type="module">import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/+esm';document.querySelector('#qr').innerHTML=new QRCode({content:location.href.replace(/marker\.html(?:.*)?$/,'index.html'),padding:4,width:600,height:600,ecl:'M'}).svg();</script></body></html>
