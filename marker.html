<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSpark AR — QR marker</title>
<style>
  body { margin:0; padding:24px; text-align:center; font:16px system-ui,sans-serif; color:#111; background:#fff; }
  h1 { font-size:24px; }
  #qr { display:block; width:60mm; height:60mm; margin:20mm auto 8mm; image-rendering:pixelated; }
  a,button { font:inherit; }
  button { padding:10px 18px; cursor:pointer; }
  @media print { button { display:none; } body { padding:0; } #qr { margin:20mm auto 8mm; } }
</style>
</head>
<body>
<h1>WebSpark AR test marker</h1>
<img id="qr" src="./qr-marker.png" alt="QR code for WebSpark AR experience" width="600" height="600">
<p>QR size: 60 × 60 mm (including white border). Print at 100%.</p>
<p><a href="https://iuliacimpianu.github.io/ar-business-card/">Open AR experience</a></p>
<button onclick="window.print()">Print QR</button>
</body>
</html>
