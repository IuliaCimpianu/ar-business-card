<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebSpark AR — V2.1 RESTORED</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a12;color:#fff;font:14px system-ui,sans-serif}#video,#gl{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#video{background:#080a12}#gl{pointer-events:none}#toolbar{position:fixed;z-index:5;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:linear-gradient(#000b,#0000)}button,a{border:0;border-radius:8px;padding:10px 14px;background:#6d28d9;color:white;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#status,#metrics{background:#111d;border-radius:8px;padding:9px 12px}#metrics{position:fixed;z-index:5;left:12px;bottom:12px;max-width:calc(100vw - 24px);white-space:pre-line;font:12px/1.6 ui-monospace,monospace}#error:not(:empty){background:#190f18e8;padding:10px;border-radius:8px}#error{position:fixed;z-index:6;left:12px;right:12px;bottom:235px;color:#ffb6b6;white-space:pre-wrap;pointer-events:none}#debug{position:fixed;z-index:4;inset:0;width:100%;height:100%;pointer-events:none}#debug.hidden{display:none}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div id="toolbar"><button id="start">Start camera</button><button id="stop" hidden>Stop camera</button><a href="../marker.html" target="_blank" rel="noopener">QR marker</a><button id="toggle">Debug: off</button><button id="copy">Copy diagnostics</button><span id="status">Loading libraries…</span></div>
<pre id="metrics">Waiting for camera…</pre><div id="error"></div><canvas id="debug" class="hidden"></canvas>
<script>
// These handlers run even if a module cannot be parsed or loaded.
const report=message=>{document.getElementById('error').textContent=message;};
window.addEventListener('error',e=>{if(e.message)report(e.message);else if(e.target?.src)report('Failed to load '+e.target.src);},true);
window.addEventListener('unhandledrejection',e=>report(String(e.reason?.message||e.reason)));
</script>
<script src="./vendor/jsQR.js"></script>
<script type="module">
import('./main-restored.js').catch(e=>report('Could not start V2.1 RESTORED: '+e.message+'. Upload the complete v2 folder, then reload.'));
</script>
</body>
</html>
