
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AR Business Card - Talking Avatar</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- A-Frame Extras -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }

    /* Camera video */
    video {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      z-index: -2;
    }

    /* Start overlay */
    #overlay-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      color: white;
      background: rgba(15, 23, 42, 0.97);
      z-index: 99999;
      transition: opacity 0.5s ease;
    }

    #overlay-screen h2 {
      margin-bottom: 10px;
      font-size: 25px;
    }

    #overlay-screen p {
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-start {
      border: none;
      border-radius: 10px;
      padding: 16px 30px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-start:disabled {
      opacity: 0.6;
    }

    /* Status */
    #status-toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 13px 20px;
      border-radius: 30px;
      font-size: 13px;
      text-align: center;
      z-index: 9999;
      width: max-content;
      max-width: 90%;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- AUDIO AND LIP SYNC COMPONENT -->
  <script>
    let audioContext = null;
    let audioAnalyser = null;
    let audioSource = null;
    let audioData = null;
    let audioUnlocked = false;

    function initializeAudio() {

      if (audioContext) return;

      const audio = document.getElementById('voice-audio');

      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        console.warn('Web Audio API unavailable');
        return;
      }

      try {
        audioContext = new AudioContextClass();

        audioSource =
          audioContext.createMediaElementSource(audio);

        audioAnalyser = audioContext.createAnalyser();

        audioAnalyser.fftSize = 64;

        audioData = new Uint8Array(
          audioAnalyser.frequencyBinCount
        );

        audioSource.connect(audioAnalyser);
        audioAnalyser.connect(audioContext.destination);

      } catch (error) {
        console.error('Audio initialization error:', error);
      }
    }

    AFRAME.registerComponent('web-audio-lipsync', {

      init: function () {

        this.mouthMeshes = [];

        this.el.addEventListener('model-loaded', () => {

          const model = this.el.getObject3D('mesh');

          if (!model) return;

          model.traverse((node) => {

            if (
              node.isMesh &&
              node.morphTargetInfluences &&
              node.morphTargetDictionary
            ) {
              this.mouthMeshes.push(node);
            }

          });

          console.log(
            'Lip sync meshes found:',
            this.mouthMeshes.length
          );

        });
      },

      tick: function () {

        if (
          !audioAnalyser ||
          !audioData ||
          this.mouthMeshes.length === 0
        ) return;

        audioAnalyser.getByteFrequencyData(audioData);

        let sum = 0;

        for (let i = 0; i < audioData.length; i++) {
          sum += audioData[i];
        }

        const volume = Math.min(
          1,
          (sum / audioData.length / 255) * 2.5
        );

        this.mouthMeshes.forEach((mesh) => {

          const dictionary = mesh.morphTargetDictionary;
          const influences = mesh.morphTargetInfluences;

          if (dictionary.jawOpen !== undefined) {
            influences[dictionary.jawOpen] = volume;
          }

          if (dictionary.mouthOpen !== undefined) {
            influences[dictionary.mouthOpen] =
              volume * 0.8;
          }

        });
      }
    });
  </script>

</head>

<body>

  <!-- START SCREEN -->
  <div id="overlay-screen">

    <h2>AR Business Experience</h2>

    <p>
      Welcome! Tap below to activate your camera
      and audio, then scan your business card.
    </p>

    <button class="btn-start" id="btn-activate">
      ENTER AR SCENE
    </button>

  </div>

  <!-- STATUS MESSAGE -->
  <div id="status-toast">
    Waiting for camera...
  </div>

  <!-- VOICE AUDIO -->
  <audio
    id="voice-audio"
    src="assets/voice.mp3"
    preload="auto"
    playsinline>
  </audio>

  <!-- AR SCENE -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="
      sourceType: webcam;
      videoTexture: true;
      debugUIEnabled: false;
      detectionMode: mono_matrix;
      trackingMethod: best;
    ">

    <!-- ASSETS -->
    <a-assets timeout="15000">

      <a-asset-item
        id="avatar-model"
        src="assets/avatar.glb">
      </a-asset-item>

    </a-assets>

    <!-- MARKER -->
    <a-marker
      id="business-card-marker"
      type="pattern"
      url="assets/custom-logo.patt"
      emitevents="true">

      <!-- AVATAR -->
      <a-entity
        id="business-avatar"
        gltf-model="#avatar-model"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.05 0.05 0.05"
        animation-mixer
        web-audio-lipsync>
      </a-entity>

    </a-marker>

    <!-- CAMERA -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- APPLICATION SCRIPT -->
  <script>

    const overlay =
      document.getElementById('overlay-screen');

    const startButton =
      document.getElementById('btn-activate');

    const statusToast =
      document.getElementById('status-toast');

    const audioTrack =
      document.getElementById('voice-audio');

    const marker =
      document.getElementById('business-card-marker');

    const scene =
      document.querySelector('a-scene');

    let markerVisible = false;
    let appStarted = false;

    function updateStatus(message, color) {

      statusToast.innerText = message;

      statusToast.style.background =
        color || 'rgba(0,0,0,0.85)';
    }

    // START APPLICATION
    startButton.addEventListener('click', async () => {

      if (appStarted) return;

      appStarted = true;
      audioUnlocked = true;

      startButton.disabled = true;
      startButton.innerText = 'STARTING CAMERA...';

      initializeAudio();

      if (audioContext) {
        try {
          await audioContext.resume();
        } catch (error) {
          console.warn('Audio resume:', error);
        }
      }

      updateStatus('Starting camera...');

      // Wait for scene initialization
      if (!scene.hasLoaded) {
        await new Promise(resolve => {
          scene.addEventListener('loaded', resolve, {
            once: true
          });
        });
      }

      // Hide overlay after initialization
      overlay.style.opacity = '0';

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 500);

    });

    // CAMERA INITIALIZED
    scene.addEventListener('camera-init', () => {

      console.log('Camera initialized');

      updateStatus(
        'Camera active! Scan your business card.',
        'rgba(16,185,129,0.9)'
      );

    });

    // CAMERA ERROR
    scene.addEventListener('camera-error', (event) => {

      console.error('Camera error:', event);

      updateStatus(
        'Camera error. Check browser permissions.',
        'rgba(220,38,38,0.95)'
      );

      startButton.disabled = false;
      startButton.innerText = 'TRY AGAIN';

      overlay.classList.remove('hidden');
      overlay.style.opacity = '1';

      appStarted = false;

    });

    // MARKER DETECTED
    marker.addEventListener('markerFound', () => {

      markerVisible = true;

      updateStatus(
        '⚡ Business Card Detected!',
        'rgba(16,185,129,0.95)'
      );

      playVoice();

    });

    // MARKER LOST
    marker.addEventListener('markerLost', () => {

      markerVisible = false;

      updateStatus(
        'Scan your business card marker...',
        'rgba(0,0,0,0.85)'
      );

      audioTrack.pause();

    });

    // PLAY AUDIO
    async function playVoice() {

      if (!audioUnlocked || !markerVisible) return;

      try {

        if (audioContext &&
            audioContext.state === 'suspended') {

          await audioContext.resume();
        }

        if (audioTrack.paused) {
          await audioTrack.play();
        }

      } catch (error) {

        console.error('Audio playback error:', error);

        updateStatus(
          'Tap to enable audio playback.',
          'rgba(220,38,38,0.9)'
        );

      }
    }

    // AUDIO FILE ERROR
    audioTrack.addEventListener('error', () => {

      console.error(
        'Voice file failed:',
        audioTrack.error
      );

    });

    // AVATAR MODEL ERROR
    document
      .getElementById('business-avatar')
      .addEventListener('model-error', (event) => {

        console.error('Avatar loading error:', event);

      });

    // SCENE ERROR
    scene.addEventListener('arjs-video-error', (event) => {

      console.error('AR video error:', event);

      updateStatus(
        'Unable to access camera.',
        'rgba(220,38,38,0.95)'
      );

    });

    // CHECK CAMERA SUPPORT
    if (!window.isSecureContext) {

      updateStatus(
        'HTTPS required for camera access.',
        'rgba(220,38,38,0.95)'
      );

      console.error('Page is not running in a secure context');

    }

    console.log('AR Business Card application loaded');

  </script>

</body>
</html>
