
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR AR Business Card - Talking Avatar</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- ANIMATION SUPPORT -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <!-- QR CODE DETECTION -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* CAMERA */
    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }

    /* AR SCENE */
    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: transparent !important;
      pointer-events: none;
    }

    /* START SCREEN */
    #overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      color: white;
      background: rgba(15, 23, 42, 0.97);
      transition: opacity 0.5s ease;
    }

    #overlay-screen h2 {
      font-size: clamp(34px, 5vw, 48px);
      line-height: 1.15;
      margin-bottom: 22px;
    }

    #overlay-screen p {
      max-width: 560px;
      color: #cbd5e1;
      font-size: clamp(19px, 2.5vw, 24px);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn-start {
      padding: 24px 48px;
      border: none;
      border-radius: 16px;
      background: #3b82f6;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start:disabled {
      opacity: 0.6;
    }

    /* STATUS */
    #status-toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 92%;
      padding: 20px 32px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 40px;
      text-align: center;
      font-size: 19px;
      line-height: 1.4;
      pointer-events: none;
    }

    /* QR SCANNER */
    #scanner-frame {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(78vw, 360px);
      height: min(78vw, 360px);
      border: 5px solid #3b82f6;
      border-radius: 28px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #scanner-frame::before,
    #scanner-frame::after {
      content: "";
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: white;
      border-style: solid;
    }

    #scanner-frame::before {
      top: -5px;
      left: -5px;
      border-width: 5px 0 0 5px;
      border-radius: 12px 0 0 0;
    }

    #scanner-frame::after {
      bottom: -5px;
      right: -5px;
      border-width: 0 5px 5px 0;
      border-radius: 0 0 12px 0;
    }

    .hidden {
      display: none !important;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      #overlay-screen {
        padding: 28px;
      }

      #overlay-screen h2 {
        font-size: 34px;
      }

      #overlay-screen p {
        font-size: 19px;
      }

      .btn-start {
        width: min(100%, 340px);
        padding: 22px 24px;
        font-size: 19px;
      }

      #status-toast {
        bottom: 20px;
        font-size: 16px;
        padding: 16px 22px;
      }

      #scanner-frame {
        width: min(82vw, 360px);
        height: min(82vw, 360px);
      }
    }
  </style>

  <!-- AUDIO AND LIP SYNC -->
  <script>
    let audioContext = null;
    let audioAnalyser = null;
    let audioSource = null;
    let audioData = null;

    function initializeAudio() {
      if (audioContext) return;

      const audio = document.getElementById('voice-audio');

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        console.warn('Web Audio API unavailable');
        return;
      }

      try {
        audioContext = new AudioContextClass();

        audioSource =
          audioContext.createMediaElementSource(audio);

        audioAnalyser =
          audioContext.createAnalyser();

        audioAnalyser.fftSize = 64;

        audioData = new Uint8Array(
          audioAnalyser.frequencyBinCount
        );

        audioSource.connect(audioAnalyser);
        audioAnalyser.connect(audioContext.destination);

        console.log('Audio initialized');

      } catch (error) {
        console.error('Audio initialization error:', error);
      }
    }

    /* LIP SYNC COMPONENT */
    AFRAME.registerComponent('web-audio-lipsync', {

      init: function () {
        this.mouthMeshes = [];

        this.el.addEventListener('model-loaded', () => {
          const model = this.el.getObject3D('mesh');

          if (!model) return;

          model.traverse((node) => {
            if (
              node.isMesh &&
              node.morphTargetInfluences &&
              node.morphTargetDictionary
            ) {
              this.mouthMeshes.push(node);
            }
          });

          console.log(
            'Lip sync meshes:',
            this.mouthMeshes.length
          );
        });
      },

      tick: function () {
        if (
          !audioAnalyser ||
          !audioData ||
          !this.mouthMeshes.length
        ) return;

        audioAnalyser.getByteFrequencyData(audioData);

        let sum = 0;

        for (let i = 0; i < audioData.length; i++) {
          sum += audioData[i];
        }

        const volume = Math.min(
          1,
          (sum / audioData.length / 255) * 2.5
        );

        this.mouthMeshes.forEach((mesh) => {
          const dict = mesh.morphTargetDictionary;
          const influences = mesh.morphTargetInfluences;

          if (dict.jawOpen !== undefined) {
            influences[dict.jawOpen] = volume;
          }

          if (dict.mouthOpen !== undefined) {
            influences[dict.mouthOpen] = volume * 0.8;
          }
        });
      }
    });
  </script>
</head>

<body>

  <!-- CAMERA VIDEO -->
  <video
    id="camera-feed"
    autoplay
    muted
    playsinline>
  </video>

  <!-- QR SCANNER FRAME -->
  <div id="scanner-frame"></div>

  <!-- START SCREEN -->
  <div id="overlay-screen">

    <h2>AR Business Experience</h2>

    <p>
      Welcome!

      Tap below to activate your camera.

      Scan your QR code to meet your
      interactive talking avatar.
    </p>

    <button
      class="btn-start"
      id="btn-activate">
      ENTER AR SCENE
    </button>

  </div>

  <!-- STATUS -->
  <div id="status-toast">
    Waiting for camera...
  </div>

  <!-- AUDIO -->
  <audio
    id="voice-audio"
    src="assets/voice.mp3"
    preload="auto"
    playsinline>
  </audio>

  <!-- QR SCAN CANVAS -->
  <canvas id="qr-canvas" hidden></canvas>

  <!-- AR SCENE -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="
      antialias: true;
      alpha: true;
    ">

    <!-- ASSETS -->
    <a-assets timeout="15000">
      <a-asset-item
        id="avatar-model"
        src="assets/avatar.glb">
      </a-asset-item>
    </a-assets>

    <!-- CAMERA -->
    <a-entity camera="fov: 60">

      <!-- AVATAR -->
      <a-entity
        id="business-avatar"
        gltf-model="#avatar-model"
        position="0 -0.25 -1.2"
        rotation="0 0 0"
        scale="0.25 0.25 0.25"
        animation-mixer
        web-audio-lipsync
        visible="false">
      </a-entity>

    </a-entity>

  </a-scene>

  <!-- APPLICATION -->
  <script>

    const overlay =
      document.getElementById('overlay-screen');

    const startButton =
      document.getElementById('btn-activate');

    const statusToast =
      document.getElementById('status-toast');

    const audioTrack =
      document.getElementById('voice-audio');

    const cameraFeed =
      document.getElementById('camera-feed');

    const avatar =
      document.getElementById('business-avatar');

    const scannerFrame =
      document.getElementById('scanner-frame');

    const qrCanvas =
      document.getElementById('qr-canvas');

    const qrContext =
      qrCanvas.getContext('2d', {
        willReadFrequently: true
      });

    let cameraStream = null;
    let cameraStarted = false;
    let qrScanning = false;
    let qrDetected = false;
    let sceneActivated = false;

    /* STATUS */
    function setStatus(message, color) {
      statusToast.textContent = message;

      statusToast.style.background =
        color || 'rgba(0,0,0,0.85)';
    }

    /* START CAMERA */
    startButton.addEventListener('click', async () => {

      if (cameraStarted) return;

      startButton.disabled = true;

      startButton.textContent =
        'STARTING CAMERA...';

      setStatus('Requesting camera access...');

      try {

        initializeAudio();

        if (audioContext) {
          await audioContext.resume();
        }

        /* REQUEST REAR CAMERA */
        try {

          cameraStream =
            await navigator.mediaDevices.getUserMedia({

              audio: false,

              video: {
                facingMode: {
                  ideal: 'environment'
                },

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }
              }

            });

        } catch (cameraError) {

          console.warn(
            'Rear camera unavailable. Trying default camera.',
            cameraError
          );

          cameraStream =
            await navigator.mediaDevices.getUserMedia({

              audio: false,
              video: true

            });

        }

        cameraFeed.srcObject = cameraStream;

        await cameraFeed.play();

        cameraStarted = true;

        overlay.style.opacity = '0';

        setTimeout(() => {
          overlay.classList.add('hidden');
        }, 500);

        scannerFrame.classList.remove('hidden');

        setStatus(
          'Camera active! Scan your QR code.',
          'rgba(16,185,129,0.95)'
        );

        qrScanning = true;

        scanQRCode();

      } catch (error) {

        console.error('Camera error:', error);

        setStatus(
          'Camera access failed. Check permissions and HTTPS.',
          'rgba(220,38,38,0.95)'
        );

        startButton.disabled = false;

        startButton.textContent = 'TRY AGAIN';

      }

    });

    /* QR CODE SCANNER */
    function scanQRCode() {

      if (!qrScanning) return;

      if (
        cameraFeed.readyState >=
        HTMLMediaElement.HAVE_ENOUGH_DATA
      ) {

        const videoWidth = cameraFeed.videoWidth;
        const videoHeight = cameraFeed.videoHeight;

        if (videoWidth && videoHeight) {

          const scanWidth = Math.min(videoWidth, 640);

          const scanHeight = Math.round(
            videoHeight * scanWidth / videoWidth
          );

          qrCanvas.width = scanWidth;
          qrCanvas.height = scanHeight;

          qrContext.drawImage(
            cameraFeed,
            0,
            0,
            scanWidth,
            scanHeight
          );

          const imageData =
            qrContext.getImageData(
              0,
              0,
              scanWidth,
              scanHeight
            );

          const code = jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts: 'attemptBoth'
            }
          );

          /* QR CODE DETECTED */
          if (code && !sceneActivated) {

            qrDetected = true;
            sceneActivated = true;

            onQRCodeFound(code.data);

          }

          /* QR CODE NOT DETECTED */
          if (!code && qrDetected) {

            qrDetected = false;

            onQRCodeLost();

          }

        }

      }

      requestAnimationFrame(scanQRCode);

    }

    /* QR CODE FOUND */
    function onQRCodeFound(qrContent) {

      console.log(
        'QR code detected:',
        qrContent
      );

      setStatus(
        'QR Code Detected! Welcome!',
        'rgba(16,185,129,0.95)'
      );

      /* HIDE SCANNER */
      scannerFrame.style.opacity = '0';

      scannerFrame.classList.add('hidden');

      /* SHOW AVATAR */
      avatar.setAttribute('visible', true);

      /* PLAY VOICE */
      playVoice();

    }

    /* QR CODE LOST */
    function onQRCodeLost() {

      console.log(
        'QR code no longer visible. Keeping AR scene active.'
      );

      /* DO NOT HIDE AVATAR */
      /* DO NOT STOP AUDIO */
      /* DO NOT RESET AVATAR */
      /* DO NOT SHOW SCANNER AGAIN */

      setStatus(
        'Your AR experience is active!',
        'rgba(16,185,129,0.95)'
      );

    }

    /* PLAY VOICE */
    async function playVoice() {

      try {

        if (
          audioContext &&
          audioContext.state === 'suspended'
        ) {
          await audioContext.resume();
        }

        audioTrack.currentTime = 0;

        await audioTrack.play();

        console.log('Avatar voice playing');

      } catch (error) {

        console.error(
          'Audio playback error:',
          error
        );

        setStatus(
          'Audio playback failed. Check voice.mp3.',
          'rgba(220,38,38,0.95)'
        );

      }

    }

    /* AUDIO ENDED */
    audioTrack.addEventListener('ended', () => {

      console.log('Voice finished');

      if (sceneActivated) {

        setStatus(
          'Enjoy your interactive avatar!',
          'rgba(16,185,129,0.95)'
        );

      }

    });

    /* AUDIO ERROR */
    audioTrack.addEventListener('error', () => {

      console.error(
        'Voice file loading error:',
        audioTrack.error
      );

      setStatus(
        'Unable to load voice.mp3.',
        'rgba(220,38,38,0.95)'
      );

    });

    /* AVATAR MODEL LOADED */
    avatar.addEventListener('model-loaded', () => {

      console.log(
        'Avatar model loaded successfully'
      );

    });

    /* AVATAR MODEL ERROR */
    avatar.addEventListener('model-error', (event) => {

      console.error(
        'Avatar loading error:',
        event
      );

      setStatus(
        'Unable to load avatar.glb.',
        'rgba(220,38,38,0.95)'
      );

    });

    /* ENVIRONMENT DIAGNOSTICS */
    console.log(
      'A-Frame version:',
      AFRAME.version
    );

    console.log(
      'QR scanner available:',
      typeof jsQR !== 'undefined'
    );

    console.log(
      'HTTPS secure context:',
      window.isSecureContext
    );

    console.log(
      'Camera API available:',
      !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      )
    );

    if (!window.isSecureContext) {

      setStatus(
        'HTTPS is required for camera access.',
        'rgba(220,38,38,0.95)'
      );

    }

    console.log(
      'QR AR Business Experience ready'
    );

  </script>

</body>
</html>
