
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AR Business Card - Talking Avatar</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.JS -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- ANIMATION SUPPORT -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* AR SCENE */
    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* DO NOT FORCE VIDEO POSITION OR Z-INDEX.
       AR.JS CONTROLS THE CAMERA VIDEO ELEMENT. */

    /* START SCREEN */
    #overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 25px;
      text-align: center;

      color: white;
      background: rgba(15, 23, 42, 0.97);

      transition: opacity 0.5s ease;
    }

    #overlay-screen h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    #overlay-screen p {
      max-width: 320px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-start {
      padding: 16px 30px;
      border: none;
      border-radius: 10px;

      background: #3b82f6;
      color: white;

      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start:disabled {
      opacity: 0.6;
    }

    /* STATUS */
    #status-toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      width: max-content;
      max-width: 90%;

      padding: 13px 20px;

      background: rgba(0, 0, 0, 0.85);
      color: white;

      border-radius: 30px;

      text-align: center;
      font-size: 13px;

      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- AUDIO AND LIP SYNC -->
  <script>

    let audioContext = null;
    let audioAnalyser = null;
    let audioSource = null;
    let audioData = null;
    let audioUnlocked = false;

    function initializeAudio() {

      if (audioContext) return;

      const audio =
        document.getElementById('voice-audio');

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        console.warn('Web Audio API unavailable');
        return;
      }

      try {

        audioContext = new AudioContextClass();

        audioSource =
          audioContext.createMediaElementSource(audio);

        audioAnalyser =
          audioContext.createAnalyser();

        audioAnalyser.fftSize = 64;

        audioData = new Uint8Array(
          audioAnalyser.frequencyBinCount
        );

        audioSource.connect(audioAnalyser);

        audioAnalyser.connect(
          audioContext.destination
        );

        console.log('Audio initialized');

      } catch (error) {

        console.error('Audio error:', error);

      }
    }

    /* LIP SYNC COMPONENT */

    AFRAME.registerComponent('web-audio-lipsync', {

      init: function () {

        this.mouthMeshes = [];

        this.el.addEventListener('model-loaded', () => {

          const model =
            this.el.getObject3D('mesh');

          if (!model) return;

          model.traverse((node) => {

            if (
              node.isMesh &&
              node.morphTargetInfluences &&
              node.morphTargetDictionary
            ) {

              this.mouthMeshes.push(node);

            }

          });

          console.log(
            'Lip sync meshes:',
            this.mouthMeshes.length
          );

        });
      },

      tick: function () {

        if (
          !audioAnalyser ||
          !audioData ||
          !this.mouthMeshes.length
        ) return;

        audioAnalyser.getByteFrequencyData(
          audioData
        );

        let sum = 0;

        for (let i = 0; i < audioData.length; i++) {
          sum += audioData[i];
        }

        const volume = Math.min(
          1,
          (sum / audioData.length / 255) * 2.5
        );

        this.mouthMeshes.forEach((mesh) => {

          const dict =
            mesh.morphTargetDictionary;

          const influences =
            mesh.morphTargetInfluences;

          if (dict.jawOpen !== undefined) {
            influences[dict.jawOpen] = volume;
          }

          if (dict.mouthOpen !== undefined) {
            influences[dict.mouthOpen] =
              volume * 0.8;
          }

        });
      }
    });

  </script>

</head>

<body>

  <!-- START SCREEN -->

  <div id="overlay-screen">

    <h2>AR Business Experience</h2>

    <p>
      Tap below to activate your camera and audio.
      Then scan your business card to meet your
      interactive animated avatar.
    </p>

    <button
      class="btn-start"
      id="btn-activate">

      ENTER AR SCENE

    </button>

  </div>

  <!-- STATUS MESSAGE -->

  <div id="status-toast">
    Waiting for camera...
  </div>

  <!-- VOICE FILE -->

  <audio
    id="voice-audio"
    src="assets/voice.mp3"
    preload="auto"
    playsinline>
  </audio>

  <!-- AR SCENE -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      videoTexture: true;
      debugUIEnabled: false;
      detectionMode: mono_matrix;
      trackingMethod: best;
    ">

    <!-- ASSETS -->

    <a-assets timeout="15000">

      <a-asset-item
        id="avatar-model"
        src="assets/avatar.glb">
      </a-asset-item>

    </a-assets>

    <!-- BUSINESS CARD MARKER -->

    <a-marker

      id="business-card-marker"

      type="pattern"

      url="assets/custom-logo.patt"

      emitevents="true">

      <!-- AVATAR -->

      <a-entity

        id="business-avatar"

        gltf-model="#avatar-model"

        position="0 0 0"

        rotation="0 0 0"

        scale="0.05 0.05 0.05"

        animation-mixer

        web-audio-lipsync>

      </a-entity>

    </a-marker>

    <!-- CAMERA -->

    <a-entity camera></a-entity>

  </a-scene>

  <!-- APPLICATION -->

  <script>

    const overlay =
      document.getElementById('overlay-screen');

    const startButton =
      document.getElementById('btn-activate');

    const statusToast =
      document.getElementById('status-toast');

    const audioTrack =
      document.getElementById('voice-audio');

    const marker =
      document.getElementById('business-card-marker');

    const scene =
      document.querySelector('a-scene');

    let markerVisible = false;
    let appStarted = false;

    function setStatus(message, color) {

      statusToast.textContent = message;

      statusToast.style.background =
        color || 'rgba(0,0,0,0.85)';

    }

    /* CAMERA AND AUDIO START */

    startButton.addEventListener('click', async () => {

      if (appStarted) return;

      appStarted = true;
      audioUnlocked = true;

      startButton.disabled = true;

      startButton.textContent =
        'STARTING CAMERA...';

      setStatus('Requesting camera access...');

      initializeAudio();

      if (audioContext) {

        try {
          await audioContext.resume();
        } catch (error) {
          console.warn('Audio resume:', error);
        }

      }

      /*
        AR.JS normally initializes the webcam
        when the scene starts. Wait for scene load.
      */

      if (!scene.hasLoaded) {

        await new Promise((resolve) => {

          scene.addEventListener(
            'loaded',
            resolve,
            { once: true }
          );

        });

      }

      overlay.style.opacity = '0';

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 500);

    });

    /* CAMERA INITIALIZED */

    scene.addEventListener('camera-init', (event) => {

      console.log(
        'Camera initialized:',
        event.detail
      );

      setStatus(
        'Camera active! Scan your business card.',
        'rgba(16,185,129,0.95)'
      );

    });

    /* CAMERA ERROR */

    scene.addEventListener('camera-error', (event) => {

      console.error(
        'Camera error:',
        event
      );

      setStatus(
        'Camera error. Check permissions.',
        'rgba(220,38,38,0.95)'
      );

      startButton.disabled = false;

      startButton.textContent =
        'TRY AGAIN';

      overlay.classList.remove('hidden');

      overlay.style.opacity = '1';

      appStarted = false;

    });

    /* VIDEO LOADED */

    scene.addEventListener('arjs-video-loaded', () => {

      console.log('AR video loaded');

      setStatus(
        'Camera video loaded. Scan your card.',
        'rgba(16,185,129,0.95)'
      );

    });

    /* MARKER FOUND */

    marker.addEventListener('markerFound', () => {

      markerVisible = true;

      setStatus(
        '⚡ Business Card Detected!',
        'rgba(16,185,129,0.95)'
      );

      playVoice();

    });

    /* MARKER LOST */

    marker.addEventListener('markerLost', () => {

      markerVisible = false;

      setStatus(
        'Scan your business card marker...',
        'rgba(0,0,0,0.85)'
      );

      audioTrack.pause();

    });

    /* AUDIO PLAYBACK */

    async function playVoice() {

      if (!audioUnlocked || !markerVisible) {
        return;
      }

      try {

        if (
          audioContext &&
          audioContext.state === 'suspended'
        ) {

          await audioContext.resume();

        }

        if (audioTrack.paused) {

          await audioTrack.play();

        }

      } catch (error) {

        console.error(
          'Audio playback error:',
          error
        );

        setStatus(
          'Audio playback unavailable.',
          'rgba(220,38,38,0.95)'
        );

      }

    }

    /* AUDIO ERROR */

    audioTrack.addEventListener('error', () => {

      console.error(
        'Voice file failed to load:',
        audioTrack.error
      );

    });

    /* AVATAR ERROR */

    document
      .getElementById('business-avatar')
      .addEventListener('model-error', (event) => {

        console.error(
          'Avatar loading error:',
          event
        );

      });

    /* AR VIDEO ERROR */

    scene.addEventListener('arjs-video-error', (event) => {

      console.error(
        'AR video error:',
        event
      );

      setStatus(
        'Unable to start camera.',
        'rgba(220,38,38,0.95)'
      );

    });

    /* ENVIRONMENT DIAGNOSTICS */

    console.log(
      'A-Frame version:',
      AFRAME.version
    );

    console.log(
      'AR.js component:',
      AFRAME.components.arjs
    );

    console.log(
      'HTTPS secure context:',
      window.isSecureContext
    );

    console.log(
      'Camera API available:',
      !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      )
    );

    /* CHECK VIDEO ELEMENT */

    scene.addEventListener('camera-init', () => {

      setTimeout(() => {

        const videos =
          document.querySelectorAll('video');

        console.log(
          'Camera video elements:',
          videos.length
        );

        videos.forEach((video, index) => {

          console.log('Video', index, {
            readyState: video.readyState,
            paused: video.paused,
            width: video.videoWidth,
            height: video.videoHeight
          });

        });

      }, 1000);

    });

    /* SECURE CONNECTION CHECK */

    if (!window.isSecureContext) {

      setStatus(
        'HTTPS is required for camera access.',
        'rgba(220,38,38,0.95)'
      );

    }

    console.log(
      'AR Business Experience ready'
    );

  </script>

</body>
</html>
