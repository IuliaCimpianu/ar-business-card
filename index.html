
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>QR AR Business Experience</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    /* CAMERA VIDEO - KEEP BEHIND THE AR CANVAS */
    video.mindar-video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      display: block !important;
      background: transparent !important;
    }

    /* TRANSPARENT AR SCENE */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene canvas,
    .a-canvas {
      background: transparent !important;
    }

    /* START SCREEN */
    #overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      color: white;
      background: rgba(15, 23, 42, 0.97);
      transition: opacity 0.5s ease;
    }

    #overlay-screen h1 {
      font-size: clamp(34px, 5vw, 48px);
      margin-bottom: 20px;
    }

    #overlay-screen p {
      max-width: 560px;
      color: #cbd5e1;
      font-size: 20px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .btn-start {
      padding: 22px 45px;
      border: none;
      border-radius: 14px;
      background: #3b82f6;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start:disabled {
      opacity: 0.6;
    }

    /* STATUS MESSAGE */
    #status-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 92%;
      padding: 17px 27px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 40px;
      text-align: center;
      font-size: 17px;
      line-height: 1.4;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      #overlay-screen {
        padding: 25px;
      }

      #overlay-screen h1 {
        font-size: 34px;
      }

      #overlay-screen p {
        font-size: 18px;
      }

      .btn-start {
        width: 100%;
        max-width: 340px;
        padding: 21px;
        font-size: 18px;
      }

      #status-toast {
        bottom: 20px;
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>

  <script>
    // AUDIO AND LIP SYNC

    let audioContext = null;
    let audioAnalyser = null;
    let audioSource = null;
    let audioData = null;

    function initializeAudio() {
      if (audioContext) return;

      const audio = document.getElementById("voice-audio");

      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      try {
        audioContext = new AudioContextClass();

        audioSource =
          audioContext.createMediaElementSource(audio);

        audioAnalyser =
          audioContext.createAnalyser();

        audioAnalyser.fftSize = 64;

        audioData = new Uint8Array(
          audioAnalyser.frequencyBinCount
        );

        audioSource.connect(audioAnalyser);
        audioAnalyser.connect(audioContext.destination);

      } catch (error) {
        console.error("Audio initialization error:", error);
      }
    }

    // AVATAR LIP SYNC

    AFRAME.registerComponent("web-audio-lipsync", {
      init: function () {
        this.mouthMeshes = [];

        this.el.addEventListener("model-loaded", () => {
          const model = this.el.getObject3D("mesh");

          if (!model) return;

          model.traverse(node => {
            if (
              node.isMesh &&
              node.morphTargetInfluences &&
              node.morphTargetDictionary
            ) {
              this.mouthMeshes.push(node);
            }
          });

          console.log(
            "Lip sync meshes:",
            this.mouthMeshes.length
          );
        });
      },

      tick: function () {
        if (
          !audioAnalyser ||
          !audioData ||
          !this.mouthMeshes.length
        ) {
          return;
        }

        audioAnalyser.getByteFrequencyData(audioData);

        let sum = 0;

        for (let i = 0; i < audioData.length; i++) {
          sum += audioData[i];
        }

        const volume = Math.min(
          1,
          (sum / audioData.length / 255) * 2.5
        );

        this.mouthMeshes.forEach(mesh => {
          const dictionary = mesh.morphTargetDictionary;
          const influences = mesh.morphTargetInfluences;

          if (dictionary.jawOpen !== undefined) {
            influences[dictionary.jawOpen] = volume;
          }

          if (dictionary.mouthOpen !== undefined) {
            influences[dictionary.mouthOpen] = volume * 0.8;
          }
        });
      }
    });
  </script>
</head>

<body>

  <!-- START SCREEN -->

  <div id="overlay-screen">
    <h1>AR Business Experience</h1>

    <p>
      Welcome! Tap below to activate your camera.
      Point your camera at the QR code to meet
      your interactive talking avatar.
    </p>

    <button class="btn-start" id="btn-activate">
      ENTER AR EXPERIENCE
    </button>
  </div>

  <!-- STATUS MESSAGE -->

  <div id="status-toast">
    Ready to start your AR experience
  </div>

  <!-- AUDIO -->

  <audio
    id="voice-audio"
    src="assets/voice.mp3"
    preload="auto"
    playsinline>
  </audio>

  <!-- MINDAR AR SCENE -->

  <a-scene
    id="ar-scene"

    mindar-image="
      imageTargetSrc: assets/qr-code.mind;
      autoStart: false;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="15000">
      <a-asset-item
        id="avatar-model"
        src="assets/avatar.glb">
      </a-asset-item>
    </a-assets>

    <!-- QR CODE TRACKING TARGET -->

    <a-entity
      id="qr-anchor"
      mindar-image-target="targetIndex: 0"
    >

      <!-- AVATAR -->

      <a-entity
        id="business-avatar"
        gltf-model="#avatar-model"
        position="0 0.35 0.1"
        rotation="0 0 0"
        scale="0.25 0.25 0.25"
        animation-mixer
        web-audio-lipsync
        visible="true">
      </a-entity>

    </a-entity>

    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>

  <!-- JAVASCRIPT -->

  <script>
    const overlay =
      document.getElementById("overlay-screen");

    const startButton =
      document.getElementById("btn-activate");

    const statusToast =
      document.getElementById("status-toast");

    const audioTrack =
      document.getElementById("voice-audio");

    const scene =
      document.getElementById("ar-scene");

    const anchor =
      document.getElementById("qr-anchor");

    const avatar =
      document.getElementById("business-avatar");

    let sceneStarted = false;
    let voicePlayed = false;

    // STATUS MESSAGE

    function setStatus(message, color) {
      statusToast.textContent = message;

      statusToast.style.background =
        color || "rgba(0,0,0,0.85)";
    }

    // START AR CAMERA

    startButton.addEventListener("click", async () => {
      if (sceneStarted) return;

      startButton.disabled = true;
      startButton.textContent = "STARTING CAMERA...";

      setStatus("Requesting camera access...");

      try {
        initializeAudio();

        if (audioContext) {
          await audioContext.resume();
        }

        await scene.systems["mindar-image-system"].start();

        sceneStarted = true;

        overlay.style.opacity = "0";

        setTimeout(() => {
          overlay.classList.add("hidden");
        }, 500);

        setStatus(
          "Camera active! Point it at your QR code.",
          "rgba(16,185,129,0.95)"
        );

      } catch (error) {
        console.error("AR startup error:", error);

        setStatus(
          "Unable to start camera. Check permissions and HTTPS.",
          "rgba(220,38,38,0.95)"
        );

        startButton.disabled = false;
        startButton.textContent = "TRY AGAIN";
      }
    });

    // QR CODE FOUND

    anchor.addEventListener("targetFound", () => {
      console.log("QR tracking started");

      setStatus(
        "QR code detected! Welcome!",
        "rgba(16,185,129,0.95)"
      );

      avatar.setAttribute("visible", true);

      if (!voicePlayed) {
        voicePlayed = true;
        playVoice();
      }
    });

    // QR CODE LOST

    anchor.addEventListener("targetLost", () => {
      console.log("QR tracking temporarily lost");

      avatar.setAttribute("visible", true);

      setStatus(
        "AR experience active",
        "rgba(16,185,129,0.95)"
      );
    });

    // PLAY AVATAR VOICE

    async function playVoice() {
      try {
        if (
          audioContext &&
          audioContext.state === "suspended"
        ) {
          await audioContext.resume();
        }

        audioTrack.currentTime = 0;

        await audioTrack.play();

        console.log("Avatar voice playing");

      } catch (error) {
        console.error("Audio playback error:", error);

        setStatus(
          "Audio playback failed. Check voice.mp3.",
          "rgba(220,38,38,0.95)"
        );
      }
    }

    // AUDIO EVENTS

    audioTrack.addEventListener("ended", () => {
      console.log("Voice finished");

      setStatus(
        "Enjoy your interactive avatar!",
        "rgba(16,185,129,0.95)"
      );
    });

    audioTrack.addEventListener("error", () => {
      console.error("Unable to load voice.mp3");

      setStatus(
        "Unable to load voice.mp3.",
        "rgba(220,38,38,0.95)"
      );
    });

    // MODEL EVENTS

    avatar.addEventListener("model-loaded", () => {
      console.log("Avatar loaded successfully");
    });

    avatar.addEventListener("model-error", event => {
      console.error("Avatar loading error:", event);

      setStatus(
        "Unable to load avatar.glb.",
        "rgba(220,38,38,0.95)"
      );
    });

    // DEBUGGING

    console.log("A-Frame version:", AFRAME.version);
    console.log(
      "MindAR available:",
      !!scene.systems["mindar-image-system"]
    );
    console.log("Secure context:", window.isSecureContext);

    console.log("AR Business Experience ready");
  </script>

</body>
</html>
