
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>WebSpark Studio - AR Business Experience</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    #overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      color: white;
      background: rgba(15, 23, 42, 0.97);
      transition: opacity 0.4s ease;
    }

    #overlay-screen h1 {
      font-size: clamp(30px, 5vw, 46px);
      margin-bottom: 20px;
    }

    #overlay-screen p {
      max-width: 560px;
      font-size: 18px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .btn-start {
      padding: 20px 38px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start:disabled {
      opacity: 0.6;
    }

    #status-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 92%;
      padding: 13px 20px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <script>
    // AUDIO AND LIP SYNC

    let audioContext = null;
    let audioAnalyser = null;
    let audioSource = null;
    let audioData = null;

    function initializeAudio() {
      if (audioContext) return;

      const audio = document.getElementById("voice-audio");

      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      try {
        audioContext = new AudioContextClass();

        audioSource =
          audioContext.createMediaElementSource(audio);

        audioAnalyser = audioContext.createAnalyser();
        audioAnalyser.fftSize = 64;

        audioData = new Uint8Array(
          audioAnalyser.frequencyBinCount
        );

        audioSource.connect(audioAnalyser);
        audioAnalyser.connect(audioContext.destination);

      } catch (error) {
        console.error("Audio initialization error:", error);
      }
    }

    // AVATAR LIP SYNC

    AFRAME.registerComponent("web-audio-lipsync", {
      init: function () {
        this.mouthMeshes = [];
        this.smoothedVolume = 0;

        this.el.addEventListener("model-loaded", () => {
          this.mouthMeshes = [];

          const model = this.el.getObject3D("mesh");
          if (!model) return;

          model.traverse(node => {
            if (
              node.isMesh &&
              node.morphTargetInfluences &&
              node.morphTargetDictionary
            ) {
              this.mouthMeshes.push(node);
            }
          });

          console.log(
            "Lip sync meshes:",
            this.mouthMeshes.length
          );
        });
      },

      tick: function (time, delta) {
        if (
          !audioAnalyser ||
          !audioData ||
          !this.mouthMeshes.length
        ) return;

        const audio = document.getElementById("voice-audio");

        let targetVolume = 0;

        if (audio && !audio.paused && !audio.ended) {
          audioAnalyser.getByteFrequencyData(audioData);

          let sum = 0;

          for (let i = 0; i < audioData.length; i++) {
            sum += audioData[i];
          }

          targetVolume = Math.min(
            1,
            (sum / audioData.length / 255) * 2.5
          );
        }

        const smoothing = 1 - Math.exp(
          -Math.min(delta || 16, 100) / 65
        );

        this.smoothedVolume +=
          (targetVolume - this.smoothedVolume) * smoothing;

        this.mouthMeshes.forEach(mesh => {
          const dictionary = mesh.morphTargetDictionary;
          const influences = mesh.morphTargetInfluences;

          if (dictionary.jawOpen !== undefined) {
            influences[dictionary.jawOpen] =
              this.smoothedVolume;
          }

          if (dictionary.mouthOpen !== undefined) {
            influences[dictionary.mouthOpen] =
              this.smoothedVolume * 0.8;
          }
        });
      }
    });

    // SIMPLE PERFORMANCE MONITOR

    AFRAME.registerComponent("ar-performance-monitor", {
      init: function () {
        this.elapsed = 0;
        this.frames = 0;
      },

      tick: function (time, delta) {
        if (!delta || delta > 500) return;

        this.elapsed += delta;
        this.frames++;

        if (this.elapsed >= 3000) {
          const fps = Math.round(
            this.frames * 1000 / this.elapsed
          );

          console.log("AR rendering FPS:", fps);

          this.elapsed = 0;
          this.frames = 0;
        }
      }
    });
  </script>
</head>

<body>

  <!-- START SCREEN -->

  <div id="overlay-screen">
    <h1>AR Business Experience</h1>

    <p>
      Welcome! Activate your camera and point it
      at your QR business card to meet your
      interactive talking avatar.
    </p>

    <button class="btn-start" id="btn-activate">
      ENTER AR EXPERIENCE
    </button>
  </div>

  <!-- STATUS -->

  <div id="status-toast">
    Ready to start your AR experience
  </div>

  <!-- AUDIO -->

  <audio
    id="voice-audio"
    src="assets/voice.mp3"
    preload="auto"
    playsinline>
  </audio>

  <!-- AR SCENE -->

  <a-scene
    id="ar-scene"

    mindar-image="
      imageTargetSrc: assets/qr-code.mind;
      autoStart: false;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
      filterMinCF: 0.1;
      filterBeta: 1;
      warmupTolerance: 3;
      missTolerance: 10;
    "

    embedded

    renderer="
      colorManagement: true;
      antialias: true;
      alpha: true;
      precision: mediump;
    "

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    ar-performance-monitor
  >

    <!-- ASSETS -->

    <a-assets timeout="20000">
      <a-asset-item
        id="avatar-model"
        src="assets/avatar.glb">
      </a-asset-item>
    </a-assets>

    <!-- QR TRACKING ANCHOR -->

    <a-entity
      id="qr-anchor"
      mindar-image-target="targetIndex: 0"
    >

      <!-- AVATAR -->

      <a-entity
        id="business-avatar"
        gltf-model="#avatar-model"
        position="0 0.35 0.1"
        rotation="0 0 0"
        scale="0.83 0.83 0.83"
        animation-mixer
        web-audio-lipsync
        visible="true">
      </a-entity>

    </a-entity>

    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>

  <script>
    const overlay =
      document.getElementById("overlay-screen");

    const startButton =
      document.getElementById("btn-activate");

    const statusToast =
      document.getElementById("status-toast");

    const audioTrack =
      document.getElementById("voice-audio");

    const scene =
      document.getElementById("ar-scene");

    const anchor =
      document.getElementById("qr-anchor");

    const avatar =
      document.getElementById("business-avatar");

    let sceneStarted = false;
    let voicePlayed = false;
    let trackingActive = false;

    function setStatus(message, color) {
      statusToast.textContent = message;

      statusToast.style.background =
        color || "rgba(0,0,0,0.8)";
    }

    // START CAMERA

    startButton.addEventListener("click", async () => {
      if (sceneStarted) return;

      startButton.disabled = true;
      startButton.textContent = "STARTING CAMERA...";

      setStatus("Requesting camera access...");

      try {
        initializeAudio();

        if (audioContext) {
          await audioContext.resume();
        }

        // Ensure A-Frame is initialized
        if (!scene.hasLoaded) {
          await new Promise(resolve => {
            scene.addEventListener(
              "loaded",
              resolve,
              { once: true }
            );
          });
        }

        await scene.systems["mindar-image-system"].start();

        sceneStarted = true;

        overlay.style.opacity = "0";

        setTimeout(() => {
          overlay.classList.add("hidden");
        }, 400);

        setStatus(
          "Camera active! Point at your QR code.",
          "rgba(16,185,129,0.9)"
        );

      } catch (error) {
        console.error("AR startup error:", error);

        setStatus(
          "Unable to start camera. Check HTTPS and permissions.",
          "rgba(220,38,38,0.9)"
        );

        startButton.disabled = false;
        startButton.textContent = "TRY AGAIN";
      }
    });

    // TARGET FOUND

    anchor.addEventListener("targetFound", () => {
      console.log("QR target found");

      trackingActive = true;

      setStatus(
        "QR detected - tracking active",
        "rgba(16,185,129,0.9)"
      );

      if (!voicePlayed) {
        voicePlayed = true;
        playVoice();
      }
    });

    // TARGET LOST

    anchor.addEventListener("targetLost", () => {
      console.log("QR target lost");

      trackingActive = false;

      // MindAR manages the anchor visibility.
      // Do not force the child avatar visible here.
      // Doing so cannot restore a hidden parent.

      setStatus(
        "Tracking lost - point camera at QR",
        "rgba(0,0,0,0.8)"
      );
    });

    // PLAY VOICE

    async function playVoice() {
      try {
        if (
          audioContext &&
          audioContext.state === "suspended"
        ) {
          await audioContext.resume();
        }

        audioTrack.currentTime = 0;

        await audioTrack.play();

        console.log("Avatar voice playing");

      } catch (error) {
        console.error("Audio playback error:", error);

        voicePlayed = false;

        setStatus(
          "Audio playback blocked or unavailable.",
          "rgba(220,38,38,0.9)"
        );
      }
    }

    // AUDIO EVENTS

    audioTrack.addEventListener("ended", () => {
      console.log("Voice finished");

      if (trackingActive) {
        setStatus(
          "Enjoy your interactive avatar!",
          "rgba(16,185,129,0.9)"
        );
      }
    });

    audioTrack.addEventListener("error", () => {
      console.error("Unable to load voice.mp3");

      setStatus(
        "Unable to load voice.mp3.",
        "rgba(220,38,38,0.9)"
      );
    });

    // MODEL EVENTS

    avatar.addEventListener("model-loaded", () => {
      console.log("Avatar loaded successfully");
    });

    avatar.addEventListener("model-error", event => {
      console.error("Avatar loading error:", event);

      setStatus(
        "Unable to load avatar.glb.",
        "rgba(220,38,38,0.9)"
      );
    });

    // DEBUG

    console.log("A-Frame version:", AFRAME.version);
    console.log("Secure context:", window.isSecureContext);
    console.log("AR Business Experience ready");
  </script>

</body>
</html>
